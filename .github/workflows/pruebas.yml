# En cada push y pull request: las pruebas automáticas y el notebook en modo
# rápido con la muestra del repositorio. Si alguien rompe algo, se ve aquí.
name: pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias (PyTorch para CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt nbconvert ipykernel
      - name: Pruebas automáticas
        run: pytest -q tests
      - name: Notebook principal en modo rápido
        env:
          QD_MODO_RAPIDO: "1"
          MPLBACKEND: Agg
        run: |
          cd notebooks
          jupyter nbconvert --to notebook --execute proyecto_quickdraw.ipynb \
            --output /tmp/ejecutado.ipynb --ExecutePreprocessor.timeout=1200
